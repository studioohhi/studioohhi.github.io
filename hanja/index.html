<meta name="mobile-web-app-capable" content="yes" />

<meta name="theme-color" content="#0D1016" media="(prefers-color-scheme: dark)" />

<style>
  :root{
    --brand:#002A86;
    --on-brand:#FFFFFF;
    --brand-tint:#ECEFF7;
    --brand-soft:#C7D2EA;
    --ink:#14171C;
    --ink-2:#333A46;
    --canvas:#F3F4F6;
    --sheet:#FFFFFF;
    --line:#E2E3E5;
    --line-soft:#ECEDEF;
    --muted:#8A8F9B;
    --muted-2:#646A76;
    --ok:#0E6B4F;
    --ok-tint:#E7F2EC;
    --no:#B72C2C;
    --no-tint:#FAEBEA;
    --sans:'Inter','Helvetica Neue','Apple SD Gothic Neo',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --serif:'Noto Serif KR','AppleMyungjo','Nanum Myeongjo',Batang,serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --brand:#8FABE8; --on-brand:#0D1016; --brand-tint:#182233; --brand-soft:#2E3C58;
      --ink:#E9ECF1; --ink-2:#C3C9D4;
      --canvas:#0D1016; --sheet:#141922;
      --line:#262C38; --line-soft:#1C212A;
      --muted:#79818F; --muted-2:#9AA2B0;
      --ok:#4FC79B; --ok-tint:#132A23; --no:#F0867E; --no-tint:#2B1A19;
    }
  }
  :root[data-theme="dark"]{
    --brand:#8FABE8; --on-brand:#0D1016; --brand-tint:#182233; --brand-soft:#2E3C58;
    --ink:#E9ECF1; --ink-2:#C3C9D4;
    --canvas:#0D1016; --sheet:#141922;
    --line:#262C38; --line-soft:#1C212A;
    --muted:#79818F; --muted-2:#9AA2B0;
    --ok:#4FC79B; --ok-tint:#132A23; --no:#F0867E; --no-tint:#2B1A19;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ height:100%; -webkit-text-size-adjust:100%; }
  body{
    position:fixed; inset:0; overflow:hidden; overscroll-behavior:none;
    background:var(--canvas); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.45; letter-spacing:-0.005em;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  button,select{ font:inherit; color:inherit; background:transparent; border:0; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--brand); outline-offset:2px; }
  .mono{ font-family:var(--mono); letter-spacing:0; font-variant-numeric:tabular-nums; }

  /* ---------- app shell ---------- */
  .app{
    height:100%; max-width:600px; margin:0 auto;
    display:grid; grid-template-rows:auto minmax(0,1fr) auto;
    padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);
  }

  /* ---------- header ---------- */
  .hd{ display:flex; flex-direction:column; gap:9px; padding-bottom:11px; }
  .hd-row{ display:flex; align-items:center; gap:8px; }
  .title{ font-family:var(--serif); font-weight:400; font-size:17px; letter-spacing:0.03em; }
  .counter{
    margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted);
    letter-spacing:0.02em; display:flex; gap:10px; align-items:baseline;
  }
  .counter b{ color:var(--ink); font-weight:500; }
  .counter .ok{ color:var(--ok); }
  .counter .no{ color:var(--no); }

  .seg{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--sheet); flex:0 0 auto; }
  .seg button{ padding:8px 14px; font-size:13px; color:var(--muted-2); border-right:1px solid var(--line); }
  .seg button:last-child{ border-right:0; }
  .seg button[aria-selected="true"]{ background:var(--brand); color:var(--on-brand); }

  .sel{ position:relative; flex:1 1 auto; display:flex; }
  .sel select{
    appearance:none; width:100%; padding:10px 32px 10px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--sheet);
    font-family:var(--mono); font-size:13px;
  }
  .sel::after{
    content:''; position:absolute; right:13px; top:50%; width:6px; height:6px;
    border-right:1.5px solid var(--muted-2); border-bottom:1.5px solid var(--muted-2);
    transform:translateY(-5px) rotate(45deg); pointer-events:none;
  }
  .dirbtn{
    flex:0 0 auto; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    background:var(--sheet); font-size:12.5px; color:var(--muted-2);
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .dirbtn .sw{ font-family:var(--mono); color:var(--brand); font-size:12px; }

  /* ---------- stage ---------- */
  .stage{ position:relative; min-height:0; display:flex; }
  .view{ flex:1; min-height:0; display:none; }
  .view.on{ display:flex; }

  .card{
    flex:1; min-height:0;
    background:var(--sheet); border:1px solid var(--line); border-radius:12px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:20px; text-align:center; overflow:hidden;
  }
  .card.is-marked{ border-color:var(--brand-soft); }
  .glyph{
    font-family:var(--serif); font-weight:300; line-height:1;
    font-size:min(42vmin, 180px); color:var(--ink);
  }
  .glyph.sm{ font-size:min(28vmin, 120px); }
  .prompt-ko{ font-size:min(9vmin, 38px); font-weight:400; line-height:1.3; letter-spacing:-0.02em; }
  .answer{ display:flex; flex-direction:column; gap:4px; align-items:center; }
  .answer .hun{ font-size:min(5.5vmin, 22px); color:var(--ink-2); }
  .answer .eum{ font-size:min(8vmin, 32px); font-weight:500; color:var(--brand); }
  .tap{ font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); }
  .reveal{ animation:rise .15s ease-out; }
  @keyframes rise{ from{ opacity:0; transform:translateY(4px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .reveal{ animation:none; } }

  /* panels (setup / result) */
  .panel{
    flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:var(--sheet); border:1px solid var(--line); border-radius:12px; padding:20px 18px;
  }
  .panel h2{ font-size:17px; font-weight:600; margin-bottom:5px; }
  .panel p{ font-size:13.5px; color:var(--muted-2); }
  .eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:0.14em;
    text-transform:uppercase; color:var(--muted);
  }
  .choices{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .choice{
    text-align:left; padding:16px; border:1px solid var(--line); border-radius:10px;
    display:flex; flex-direction:column; gap:4px; background:transparent;
  }
  .choice:active{ background:var(--brand-tint); border-color:var(--brand); }
  .choice .t{ font-size:15px; font-weight:500; }
  .choice .d{ font-size:12.5px; color:var(--muted-2); line-height:1.4; }
  .opt{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-top:18px; padding-top:16px; border-top:1px solid var(--line-soft);
    font-size:13px; color:var(--muted-2);
  }
  .toggle{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .toggle button{ padding:8px 11px; font-size:12.5px; color:var(--muted-2); border-right:1px solid var(--line); }
  .toggle button:last-child{ border-right:0; }
  .toggle button[aria-selected="true"]{ background:var(--brand-tint); color:var(--brand); }

  .score{ display:flex; align-items:baseline; gap:10px; margin:6px 0 10px; }
  .score .big{ font-family:var(--mono); font-size:46px; font-weight:500; letter-spacing:-0.02em; }
  .score .of{ font-family:var(--mono); font-size:13px; color:var(--muted); }
  .wrongs{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .wrongs button{
    font-family:var(--serif); font-size:26px; line-height:1; font-weight:400;
    padding:10px 11px; border:1px solid var(--line); border-radius:8px; background:var(--canvas);
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .wrongs button span{ font-family:var(--sans); font-size:10.5px; color:var(--muted-2); }

  /* ---------- dock ---------- */
  .dock{ padding-top:11px; display:flex; flex-direction:column; gap:8px; }
  .ticks{ display:flex; gap:1.5px; height:9px; align-items:flex-end; margin-bottom:2px; }
  .ticks i{ flex:1 1 0; height:5px; background:var(--line); border-radius:1px; }
  .ticks i.done{ background:var(--brand-soft); }
  .ticks i.mark{ background:var(--no); }
  .ticks i.ok{ background:var(--ok); }
  .ticks i.bad{ background:var(--no); }
  .ticks i.now{ background:var(--brand); height:9px; }

  .pad{ display:flex; gap:8px; }
  .key{
    min-height:58px; border:1px solid var(--line); border-radius:10px; background:var(--sheet);
    display:flex; align-items:center; justify-content:center; gap:6px;
    font-size:15px; color:var(--ink-2); flex:1;
  }
  .key:active{ background:var(--brand-tint); }
  .key.nav{ flex:0 0 62px; font-size:19px; color:var(--muted-2); }
  .key.primary{ background:var(--brand); border-color:var(--brand); color:var(--on-brand); font-weight:500; }
  .key.primary:active{ opacity:.88; }
  .key.ok{ color:var(--ok); }
  .key.ok:active{ background:var(--ok-tint); border-color:var(--ok); }
  .key.no{ color:var(--no); }
  .key.no:active{ background:var(--no-tint); border-color:var(--no); }
  .key[disabled]{ opacity:.35; }

  .chips{ display:flex; gap:6px; }
  .chip{
    flex:1; min-height:36px; border:1px solid var(--line); border-radius:999px;
    background:var(--sheet); font-size:12px; color:var(--muted-2);
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .chip:active{ background:var(--brand-tint); }
  .chip[aria-pressed="true"]{ background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
  .chip .dot{ width:6px; height:6px; border-radius:50%; background:var(--no); }

  .kbd{
    display:none; font-family:var(--mono); font-size:10.5px; color:var(--muted);
    gap:14px; flex-wrap:wrap; padding-top:2px;
  }
  @media (hover:hover) and (pointer:fine){ .kbd{ display:flex; } }
  .kbd b{ border:1px solid var(--line); border-radius:3px; padding:1px 5px; font-weight:400; color:var(--muted-2); }
  .toast{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 20px);
    background:var(--ink); color:var(--canvas);
    font-size:12.5px; padding:10px 15px; border-radius:999px;
    opacity:0; transition:opacity .3s ease; pointer-events:none; z-index:20;
    max-width:84%; text-align:center;
  }
  .toast.on{ opacity:.94; }
  @media (prefers-reduced-motion: reduce){ .toast{ transition:none; } }
  .hide{ display:none !important; }
</style>

</head>
<body>
<div class="app">
  <header class="hd">
    <div class="hd-row">
      <span class="title">漢字 三級</span>
      <span class="counter" id="counter"></span>
    </div>
    <div class="hd-row">
      <label class="sel">
        <span class="hide">학습 구간</span>
        <select id="secSel"></select>
      </label>
      <button class="dirbtn" id="dirBtn" aria-label="문제 방향 바꾸기">
        <span class="sw" id="dirLabel">한자 → 뜻·음</span>
      </button>
      <div class="seg" role="tablist" aria-label="모드">
        <button id="mStudy" role="tab" aria-selected="true">학습</button>
        <button id="mTest" role="tab" aria-selected="false">테스트</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="view on" id="vStudy">
      <div class="card" id="sCard"><div id="sBody"></div></div>
    </div>

    <div class="view" id="vQuiz">
      <div class="card" id="qCard"><div id="qBody"></div></div>
    </div>

    <div class="view" id="vSetup">
      <div class="panel">
        <div class="eyebrow">테스트</div>
        <h2>어떻게 풀까요</h2>
        <p>카드를 보고 머릿속으로 답한 뒤, 정답을 열어 직접 채점합니다.</p>
        <div class="choices">
          <button class="choice" id="tSeq">
            <span class="t">순서대로 테스트</span>
            <span class="d">배정 순서 그대로 — 외운 흐름을 따라 점검합니다.</span>
          </button>
          <button class="choice" id="tRand">
            <span class="t">랜덤으로 테스트</span>
            <span class="d">순서를 섞어 출제 — 앞뒤 맥락 없이 글자만 보고 떠올립니다.</span>
          </button>
        </div>
        <div class="opt">
          <span>출제 범위</span>
          <div class="toggle" id="scopeToggle">
            <button data-scope="all" aria-selected="true">구간 전체</button>
            <button data-scope="marked" aria-selected="false">모름만</button>
          </div>
        </div>
        <div class="opt" id="bestRow">
          <span>이 구간 최고 기록</span>
          <span class="mono" id="tBest">기록 없음</span>
        </div>
      </div>
    </div>

    <div class="view" id="vResult">
      <div class="panel">
        <div class="eyebrow" id="rMeta">결과</div>
        <div class="score"><span class="big" id="rScore">0</span><span class="of" id="rOf"></span></div>
        <p id="rNote"></p>
        <div id="rWrongWrap">
          <div class="eyebrow" style="margin-top:20px">틀린 글자 <span id="rWrongN"></span></div>
          <div class="wrongs" id="rWrongs"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="dock" id="dock">
    <div class="ticks" id="ticks"></div>

    <div id="dStudy">
      <div class="pad">
        <button class="key nav" id="sPrev" aria-label="이전">←</button>
        <button class="key primary" id="sFlip">뜻·음 보기</button>
        <button class="key nav" id="sNext" aria-label="다음">→</button>
      </div>
      <div class="chips" style="margin-top:8px">
        <button class="chip" id="sMark" aria-pressed="false">모름</button>
        <button class="chip" id="sMarkedOnly">모름만</button>
        <button class="chip" id="sShuffle">섞기</button>
        <button class="chip" id="sReset">처음부터</button>
      </div>
    </div>

    <div id="dQuiz" class="hide">
      <div class="pad" id="qRowReveal">
        <button class="key primary" id="qReveal">정답 보기</button>
      </div>
      <div class="pad hide" id="qRowGrade">
        <button class="key no" id="qNoBtn">✕ 틀렸다</button>
        <button class="key ok" id="qOkBtn">○ 맞혔다</button>
      </div>
      <div class="chips" style="margin-top:8px">
        <button class="chip" id="qBack">이전 문제</button>
        <button class="chip" id="qQuit">그만두기</button>
      </div>
    </div>

    <div id="dResult" class="hide">
      <div class="pad">
        <button class="key primary" id="rRetryWrong">틀린 것만 다시</button>
      </div>
      <div class="chips" style="margin-top:8px">
        <button class="chip" id="rAgain">같은 방식 다시</button>
        <button class="chip" id="rBack">방식 고르기</button>
        <button class="chip" id="rNextSec">다음 구간 →</button>
      </div>
    </div>

    <div class="kbd" id="kbd"></div>
  </footer>
</div>

<script>
(function(){
  "use strict";
  var DATA = RAW_DATA.trim().split("\n").map(function(line){
    var p = line.split("|");
    return { c:p[0], hun:p[1], eum:p[2] };
  });
  var SIZE = 100;
  var SECTIONS = Math.ceil(DATA.length / SIZE);
  var KEY = "hanja3.v1";
  var $ = function(id){ return document.getElementById(id); };
  var pad = function(n, w){ n = String(n); while(n.length < (w || 3)) n = "0" + n; return n; };

  var store = { sec:0, mode:"study", dir:"h2m", scope:"all", marks:{}, best:{} };
  try{
    var saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    for(var k in saved){ if(saved[k] !== undefined) store[k] = saved[k]; }
  }catch(e){}
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

  function secRange(i){
    var a = i * SIZE + 1, b = Math.min((i + 1) * SIZE, DATA.length);
    return { a:a, b:b, label:pad(a,4) + "–" + pad(b,4) };
  }
  function secItems(i){ return DATA.slice(i * SIZE, Math.min((i + 1) * SIZE, DATA.length)); }

  /* ---------- section picker ---------- */
  var sel = $("secSel");
  for(var i = 0; i < SECTIONS; i++){
    var r = secRange(i), o = document.createElement("option");
    o.value = i;
    o.textContent = r.a + " – " + r.b + "자";
    sel.appendChild(o);
  }

  /* ---------- views ---------- */
  var view = "study";
  function setView(v){
    view = v;
    ["vStudy","vQuiz","vSetup","vResult"].forEach(function(id){
      $(id).classList.toggle("on", id === "v" + v.charAt(0).toUpperCase() + v.slice(1));
    });
    $("dStudy").classList.toggle("hide", v !== "study");
    $("dQuiz").classList.toggle("hide", v !== "quiz");
    $("dResult").classList.toggle("hide", v !== "result");
    $("ticks").classList.toggle("hide", v === "setup" || v === "result");
    $("dirBtn").classList.toggle("hide", v === "result");
    renderKbd();
  }
  function renderKbd(){
    var h = "";
    if(view === "study") h = "<span><b>Space</b> 뒤집기</span><span><b>←</b> <b>→</b> 이동</span><span><b>S</b> 모름</span><span><b>R</b> 방향</span>";
    else if(view === "quiz") h = "<span><b>Space</b> 정답</span><span><b>1</b> 맞혔다</span><span><b>2</b> 틀렸다</span>";
    $("kbd").innerHTML = h;
  }
  function setMode(m){
    store.mode = m; save();
    $("mStudy").setAttribute("aria-selected", m === "study" ? "true" : "false");
    $("mTest").setAttribute("aria-selected", m === "test" ? "true" : "false");
    if(m === "study"){ setView("study"); studyRender(); }
    else { setupRender(); setView("setup"); counterSet(secRange(store.sec).label); }
  }
  function counterSet(html){ $("counter").innerHTML = html; }
  function dirRender(){
    $("dirLabel").textContent = store.dir === "h2m" ? "한자 → 뜻·음" : "뜻·음 → 한자";
  }

  /* ---------- study ---------- */
  var S = { order:[], pos:0, open:false, onlyMarked:false };

  function studyBuild(keepPos){
    var items = secItems(store.sec);
    S.order = [];
    for(var i = 0; i < items.length; i++){
      if(S.onlyMarked && !store.marks[items[i].c]) continue;
      S.order.push(i);
    }
    if(!S.order.length){ S.onlyMarked = false; for(var j = 0; j < items.length; j++) S.order.push(j); }
    if(!keepPos) S.pos = 0;
    if(S.pos >= S.order.length) S.pos = 0;
    S.open = false;
    studyRender();
  }

  function studyRender(){
    if(view !== "study") return;
    var items = secItems(store.sec);
    var it = items[S.order[S.pos]];
    var markedCount = 0;
    for(var i = 0; i < items.length; i++) if(store.marks[items[i].c]) markedCount++;
    counterSet("<b>" + pad(S.pos + 1) + "</b>/" + S.order.length + "<span>모름 <b>" + markedCount + "</b></span>");

    var marked = !!store.marks[it.c];
    $("sMark").setAttribute("aria-pressed", marked ? "true" : "false");
    $("sCard").className = "card" + (marked ? " is-marked" : "");
    $("sMarkedOnly").setAttribute("aria-pressed", S.onlyMarked ? "true" : "false");

    var html;
    if(store.dir === "h2m"){
      html = '<div class="glyph">' + it.c + "</div>";
      html += S.open
        ? '<div class="answer reveal"><span class="hun">' + it.hun + '</span><span class="eum">' + it.eum + "</span></div>"
        : '<div class="tap">뜻과 음은?</div>';
    }else{
      html = '<div class="prompt-ko">' + it.hun + " " + it.eum + "</div>";
      html += S.open
        ? '<div class="glyph sm reveal">' + it.c + "</div>"
        : '<div class="tap">어떤 한자?</div>';
    }
    $("sBody").innerHTML = html;
    $("sFlip").textContent = S.open ? "숨기기" : (store.dir === "h2m" ? "뜻·음 보기" : "한자 보기");
    $("sPrev").disabled = S.pos === 0;
    $("sNext").disabled = S.pos === S.order.length - 1;

    var t = "";
    for(var k = 0; k < S.order.length; k++){
      var ch = items[S.order[k]].c, cls = "";
      if(k === S.pos) cls = "now";
      else if(store.marks[ch]) cls = "mark";
      else if(k < S.pos) cls = "done";
      t += '<i class="' + cls + '"></i>';
    }
    $("ticks").innerHTML = t;
  }

  function studyMove(d){
    var n = S.pos + d;
    if(n < 0 || n >= S.order.length) return;
    S.pos = n; S.open = false; studyRender();
  }
  function studyFlip(){ S.open = !S.open; studyRender(); }
  function studyToggleMark(){
    var it = secItems(store.sec)[S.order[S.pos]];
    if(store.marks[it.c]) delete store.marks[it.c]; else store.marks[it.c] = 1;
    save(); studyRender();
  }

  $("sCard").onclick = function(){ if(!ignoreTap()) studyFlip(); };
  $("sFlip").onclick = studyFlip;
  $("sPrev").onclick = function(){ studyMove(-1); };
  $("sNext").onclick = function(){ studyMove(1); };
  $("sMark").onclick = studyToggleMark;
  $("sReset").onclick = function(){ S.pos = 0; S.open = false; studyRender(); };
  $("sMarkedOnly").onclick = function(){ S.onlyMarked = !S.onlyMarked; studyBuild(false); };
  $("sShuffle").onclick = function(){
    for(var i = S.order.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1)), t = S.order[i]; S.order[i] = S.order[j]; S.order[j] = t;
    }
    S.pos = 0; S.open = false; studyRender();
  };

  /* ---------- test ---------- */
  var Q = { list:[], pos:0, open:false, ok:0, no:0, wrong:[], mode:"seq", full:true };

  function setupRender(){
    var b = store.best[store.sec];
    $("tBest").textContent = b ? b.ok + " / " + b.n : "기록 없음";
    Array.prototype.forEach.call($("scopeToggle").children, function(btn){
      btn.setAttribute("aria-selected", btn.dataset.scope === store.scope ? "true" : "false");
    });
  }
  Array.prototype.forEach.call($("scopeToggle").children, function(btn){
    btn.onclick = function(){ store.scope = btn.dataset.scope; save(); setupRender(); };
  });

  function startTest(mode, list){
    Q.mode = mode;
    Q.full = !list && store.scope === "all";
    if(!list){
      var items = secItems(store.sec);
      list = store.scope === "marked"
        ? items.filter(function(it){ return store.marks[it.c]; })
        : items.slice();
      if(!list.length){ list = items.slice(); store.scope = "all"; save(); }
      if(mode === "rand"){
        for(var i = list.length - 1; i > 0; i--){
          var j = Math.floor(Math.random() * (i + 1)), t = list[i]; list[i] = list[j]; list[j] = t;
        }
      }
    }
    Q.list = list.map(function(it){ return { c:it.c, hun:it.hun, eum:it.eum }; });
    Q.pos = 0; Q.open = false; Q.ok = 0; Q.no = 0; Q.wrong = [];
    setView("quiz"); quizRender();
  }
  $("tSeq").onclick = function(){ startTest("seq"); };
  $("tRand").onclick = function(){ startTest("rand"); };

  function quizRender(){
    var it = Q.list[Q.pos];
    counterSet("<b>" + pad(Q.pos + 1) + "</b>/" + Q.list.length +
      '<span class="ok">○ <b>' + Q.ok + '</b></span><span class="no">✕ <b>' + Q.no + "</b></span>");

    var html;
    if(store.dir === "h2m"){
      html = '<div class="glyph">' + it.c + "</div>";
      html += Q.open
        ? '<div class="answer reveal"><span class="hun">' + it.hun + '</span><span class="eum">' + it.eum + "</span></div>"
        : '<div class="tap">뜻과 음은?</div>';
    }else{
      html = '<div class="prompt-ko">' + it.hun + " " + it.eum + "</div>";
      html += Q.open
        ? '<div class="glyph sm reveal">' + it.c + "</div>"
        : '<div class="tap">어떤 한자?</div>';
    }
    $("qBody").innerHTML = html;
    $("qRowReveal").classList.toggle("hide", Q.open);
    $("qRowGrade").classList.toggle("hide", !Q.open);
    $("qBack").disabled = Q.pos === 0;

    var t = "";
    for(var k = 0; k < Q.list.length; k++){
      var cls = "";
      if(k === Q.pos) cls = "now";
      else if(k < Q.pos) cls = Q.list[k].__res === 1 ? "ok" : "bad";
      t += '<i class="' + cls + '"></i>';
    }
    $("ticks").innerHTML = t;
  }
  function reveal(){ if(!Q.open){ Q.open = true; quizRender(); } }
  function grade(good){
    if(!Q.open) return;
    var it = Q.list[Q.pos];
    it.__res = good ? 1 : 0;
    if(good){ Q.ok++; }
    else {
      Q.no++; Q.wrong.push(it);
      if(!store.marks[it.c]){ store.marks[it.c] = 1; save(); }
    }
    if(Q.pos === Q.list.length - 1){ finish(); }
    else { Q.pos++; Q.open = false; quizRender(); }
  }
  $("qCard").onclick = function(){ if(!ignoreTap()) reveal(); };
  $("qReveal").onclick = reveal;
  $("qOkBtn").onclick = function(){ grade(true); };
  $("qNoBtn").onclick = function(){ grade(false); };
  $("qQuit").onclick = function(){ setupRender(); setView("setup"); counterSet(secRange(store.sec).label); };
  $("qBack").onclick = function(){
    if(Q.pos === 0) return;
    Q.pos--;
    var it = Q.list[Q.pos];
    if(it.__res === 1) Q.ok--;
    else if(it.__res === 0){
      Q.no--;
      var i = Q.wrong.indexOf(it); if(i >= 0) Q.wrong.splice(i, 1);
    }
    it.__res = undefined; Q.open = false; quizRender();
  };

  function finish(){
    var n = Q.list.length, pct = Math.round(Q.ok / n * 100), r = secRange(store.sec);
    var prev = store.best[store.sec];
    if(Q.full && (!prev || Q.ok / n > prev.ok / prev.n)){ store.best[store.sec] = { ok:Q.ok, n:n }; save(); }
    $("rMeta").textContent = r.label + " · " + (Q.mode === "rand" ? "랜덤" : "순서대로");
    $("rScore").textContent = Q.ok;
    $("rOf").textContent = "/ " + n + " · " + pct + "%";
    $("rNote").textContent = Q.wrong.length === 0
      ? "전부 맞혔습니다. 다음 구간으로 넘어가도 좋습니다."
      : "틀린 글자는 '모름'으로 표시해 두었습니다. 학습 모드의 ‘모름만’에서 다시 꺼내 볼 수 있습니다.";
    $("rWrongWrap").classList.toggle("hide", Q.wrong.length === 0);
    $("rWrongN").textContent = Q.wrong.length ? Q.wrong.length + "자" : "";
    $("rWrongs").innerHTML = Q.wrong.map(function(it){
      return "<button>" + it.c + "<span>" + it.hun + " " + it.eum + "</span></button>";
    }).join("");
    $("rRetryWrong").disabled = Q.wrong.length === 0;
    $("rNextSec").classList.toggle("hide", store.sec >= SECTIONS - 1);
    counterSet(r.label);
    setView("result");
  }
  $("rRetryWrong").onclick = function(){ if(Q.wrong.length) startTest(Q.mode, Q.wrong.slice()); };
  $("rAgain").onclick = function(){ startTest(Q.mode); };
  $("rBack").onclick = function(){ setupRender(); setView("setup"); counterSet(secRange(store.sec).label); };
  $("rNextSec").onclick = function(){
    if(store.sec < SECTIONS - 1){
      store.sec++; save(); sel.value = store.sec;
      S.onlyMarked = false; S.pos = 0;
      setupRender(); setView("setup"); counterSet(secRange(store.sec).label);
      studyBuild(false);
    }
  };

  /* ---------- header controls ---------- */
  sel.onchange = function(){
    store.sec = parseInt(sel.value, 10); save();
    S.onlyMarked = false;
    if(store.mode === "test"){ setupRender(); setView("setup"); counterSet(secRange(store.sec).label); }
    studyBuild(false);
  };
  $("mStudy").onclick = function(){ setMode("study"); };
  $("mTest").onclick = function(){ setMode("test"); };
  $("dirBtn").onclick = function(){
    store.dir = store.dir === "h2m" ? "m2h" : "h2m"; save(); dirRender();
    if(view === "study"){ S.open = false; studyRender(); }
    else if(view === "quiz"){ Q.open = false; quizRender(); }
  };

  /* ---------- swipe (study) ---------- */
  var tx = 0, ty = 0, tracking = false, swipedAt = 0;
  var stage = $("stage");
  stage.addEventListener("touchstart", function(e){
    if(e.touches.length !== 1) return;
    tx = e.touches[0].clientX; ty = e.touches[0].clientY; tracking = true; swipedAt = 0;
  }, { passive:true });
  stage.addEventListener("touchend", function(e){
    if(!tracking) return;
    tracking = false;
    var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty;
    if(Math.abs(dx) > 46 && Math.abs(dx) > Math.abs(dy) * 1.3){
      swipedAt = Date.now();
      if(view === "study") studyMove(dx < 0 ? 1 : -1);
    }
  }, { passive:true });
  /* a tap that lands right after a swipe is the swipe's own synthetic click */
  function ignoreTap(){
    if(Date.now() - swipedAt < 500){ swipedAt = 0; return true; }
    return false;
  }

  /* ---------- keyboard (desktop) ---------- */
  Array.prototype.forEach.call(document.querySelectorAll("button"), function(btn){
    btn.addEventListener("mousedown", function(e){ e.preventDefault(); });
  });
  document.addEventListener("keydown", function(e){
    if(e.target.tagName === "SELECT" || e.target.tagName === "BUTTON") return;
    if(e.key === " " || e.key === "Enter"){
      if(view === "study" || view === "quiz") e.preventDefault();
      if(view === "study") studyFlip();
      else if(view === "quiz") reveal();
      return;
    }
    if(view === "study"){
      if(e.key === "ArrowRight"){ e.preventDefault(); studyMove(1); }
      else if(e.key === "ArrowLeft"){ e.preventDefault(); studyMove(-1); }
      else if(e.key === "s" || e.key === "S"){ studyToggleMark(); }
      else if(e.key === "r" || e.key === "R"){ $("dirBtn").click(); }
    }else if(view === "quiz"){
      if(e.key === "1" || e.key === "o" || e.key === "O"){ grade(true); }
      else if(e.key === "2" || e.key === "x" || e.key === "X"){ grade(false); }
    }
  });

  /* ---------- offline (service worker) ---------- */
  function toast(msg){
    var el = document.createElement("div");
    el.className = "toast"; el.textContent = msg;
    document.body.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add("on"); });
    setTimeout(function(){ el.classList.remove("on"); setTimeout(function(){ el.remove(); }, 400); }, 2600);
  }
  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").then(function(){
        if(localStorage.getItem("hanja3.offline")) return;
        navigator.serviceWorker.ready.then(function(){
          try{ localStorage.setItem("hanja3.offline", "1"); }catch(e){}
          toast("오프라인에서도 쓸 수 있게 저장했습니다");
        });
      }).catch(function(){});
    });
  }

  /* ---------- boot ---------- */
  store.sec = Math.min(store.sec, SECTIONS - 1);
  sel.value = store.sec;
  dirRender();
  studyBuild(false);
  setMode(store.mode === "test" ? "test" : "study");
})();
</script>

</body>
</html>
